<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Registro de Pedidos</title>
  <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #f5f6fa; min-height: 100vh; max-width: 420px; margin: 0 auto; }
    .header { background: #1a1a2e; padding: 20px; text-align: center; }
    .header .brand { font-size: 11px; color: #7c8cff; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 4px; }
    .header h1 { color: white; font-size: 20px; font-weight: 500; }
    .screen { display: none; padding: 20px; }
    .screen.active { display: block; }
    .section-title { font-size: 13px; color: #666; margin-bottom: 14px; text-align: center; }
    .emp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .emp-btn { background: white; border: 1.5px solid #e0e0e0; border-radius: 12px; padding: 14px 8px; text-align: center; cursor: pointer; transition: all 0.15s; }
    .emp-btn.selected { border-color: #7c8cff; background: #eef0ff; }
    .emp-avatar { width: 40px; height: 40px; border-radius: 50%; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; }
    .emp-name { font-size: 12px; font-weight: 500; color: #222; }
    .pin-box { background: white; border-radius: 16px; padding: 20px; }
    .pin-who { text-align: center; font-size: 14px; font-weight: 500; margin-bottom: 16px; }
    .pin-dots { display: flex; justify-content: center; gap: 14px; margin-bottom: 20px; }
    .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #7c8cff; background: transparent; transition: background 0.1s; }
    .dot.filled { background: #7c8cff; }
    .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .key { background: #f5f6fa; border: none; border-radius: 10px; padding: 14px; font-size: 20px; font-weight: 500; cursor: pointer; transition: all 0.1s; }
    .key:active { background: #7c8cff; color: white; transform: scale(0.95); }
    .key.action { font-size: 13px; color: #888; }
    .welcome-bar { background: #1a1a2e; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; margin: -20px -20px 20px -20px; }
    .logout { font-size: 12px; color: #7c8cff; cursor: pointer; background: none; border: none; font-family: inherit; }
    .scan-box { display: none; position: relative; border-radius: 14px; overflow: hidden; margin-bottom: 14px; background: #000; }
    .scan-box video { width: 100%; border-radius: 14px; display: block; min-height: 220px; object-fit: cover; }
    .scan-line { position: absolute; top: 50%; left: 10%; width: 80%; height: 2px; background: #7c8cff; box-shadow: 0 0 8px #7c8cff; transform: translateY(-50%); pointer-events: none; }
    .scan-corners { position: absolute; inset: 10px; pointer-events: none; }
    .scan-corner { position: absolute; width: 20px; height: 20px; border-color: #7c8cff; border-style: solid; }
    .scan-corner.tl { top:0; left:0; border-width: 3px 0 0 3px; }
    .scan-corner.tr { top:0; right:0; border-width: 3px 3px 0 0; }
    .scan-corner.bl { bottom:0; left:0; border-width: 0 0 3px 3px; }
    .scan-corner.br { bottom:0; right:0; border-width: 0 3px 3px 0; }
    .scan-close { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 99px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
    .scan-status { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; color: white; font-size: 12px; background: rgba(0,0,0,0.5); padding: 4px; }
    .scan-btn { width: 100%; background: #1a1a2e; color: white; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 500; cursor: pointer; margin-bottom: 12px; font-family: inherit; }
    .scan-btn:disabled { background: #999; }
    .order-label { font-size: 13px; color: #666; margin-bottom: 10px; }
    .order-input { width: 100%; font-size: 32px; font-weight: 600; text-align: center; border: 2px solid #e0e0e0; border-radius: 12px; padding: 14px; letter-spacing: 6px; font-family: monospace; background: white; -webkit-appearance: none; }
    .order-input:focus { outline: none; border-color: #7c8cff; }
    .confirm-btn { width: 100%; background: #7c8cff; color: white; border: none; border-radius: 14px; padding: 16px; font-size: 16px; font-weight: 500; margin-top: 12px; cursor: pointer; font-family: inherit; }
    .confirm-btn:disabled { background: #ccc; }
    .today-title { font-size: 11px; color: #999; letter-spacing: 1px; text-transform: uppercase; margin: 20px 0 10px; }
    .order-row { background: white; border-radius: 10px; padding: 12px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 0.5px solid #eee; }
    .order-num { font-family: monospace; font-size: 16px; font-weight: 600; }
    .order-time { font-size: 12px; color: #999; }
    .check { color: #22c55e; font-size: 18px; }
    #screen-success { text-align: center; padding-top: 60px; }
    .ok-circle { width: 80px; height: 80px; border-radius: 50%; background: #dcfce7; display: flex; align-items: center; justify-content: center; font-size: 36px; margin: 0 auto 20px; }
    .ok-num { font-size: 36px; font-weight: 700; font-family: monospace; margin-bottom: 8px; }
    .ok-sub { color: #666; margin-bottom: 30px; font-size: 14px; }
    .back-btn { background: white; border: 2px solid #7c8cff; color: #7c8cff; border-radius: 14px; padding: 14px 40px; font-size: 15px; font-weight: 500; cursor: pointer; font-family: inherit; }
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1a1a2e; color: white; padding: 10px 24px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; z-index: 999; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<div class="header">
  <div class="brand">Tu Empresa</div>
  <h1>Registro de Pedidos</h1>
</div>

<!-- LOGIN -->
<div id="screen-login" class="screen active">
  <p class="section-title" style="margin-top:16px">Seleccioná tu nombre</p>
  <div id="empGrid" class="emp-grid">
    <p style="font-size:13px;color:#666;grid-column:span 2;text-align:center;padding:20px">Cargando...</p>
  </div>
  <div id="pinBox" class="pin-box" style="display:none">
    <p class="pin-who" id="pinWho"></p>
    <div class="pin-dots">
      <div class="dot" id="pd0"></div>
      <div class="dot" id="pd1"></div>
      <div class="dot" id="pd2"></div>
      <div class="dot" id="pd3"></div>
    </div>
    <div class="pin-pad">
      <button class="key" onclick="kp('1')">1</button>
      <button class="key" onclick="kp('2')">2</button>
      <button class="key" onclick="kp('3')">3</button>
      <button class="key" onclick="kp('4')">4</button>
      <button class="key" onclick="kp('5')">5</button>
      <button class="key" onclick="kp('6')">6</button>
      <button class="key" onclick="kp('7')">7</button>
      <button class="key" onclick="kp('8')">8</button>
      <button class="key" onclick="kp('9')">9</button>
      <button class="key action" onclick="resetLogin()">✕ Volver</button>
      <button class="key" onclick="kp('0')">0</button>
      <button class="key action" onclick="delK()">⌫</button>
    </div>
  </div>
</div>

<!-- REGISTRO -->
<div id="screen-registro" class="screen">
  <div class="welcome-bar">
    <span id="welcomeName"></span>
    <button class="logout" onclick="doLogout()">Cerrar sesión</button>
  </div>

  <div id="scanBox" class="scan-box">
    <video id="video" playsinline autoplay muted></video>
    <div class="scan-line"></div>
    <div class="scan-corners">
      <div class="scan-corner tl"></div>
      <div class="scan-corner tr"></div>
      <div class="scan-corner bl"></div>
      <div class="scan-corner br"></div>
    </div>
    <button class="scan-close" onclick="stopScanner()">✕ Cerrar</button>
    <div class="scan-status" id="scanStatus">Apuntá al código de barras</div>
  </div>

  <button id="scanBtn" class="scan-btn" onclick="startScanner()">
    📷 &nbsp; Escanear código de barras
  </button>

  <p class="order-label">O ingresá el número manualmente</p>
  <input class="order-input" type="text" id="orderInput" placeholder="00000"
         oninput="onOrderInput()" inputmode="numeric" />
  <button class="confirm-btn" id="confirmBtn" disabled onclick="doConfirm()">
    ✓ &nbsp; Confirmar pedido
  </button>

  <p class="today-title">Tus pedidos de hoy (<span id="countToday">0</span>)</p>
  <div id="listToday">
    <p style="font-size:13px;color:#aaa;text-align:center;padding:16px 0">Sin registros todavía</p>
  </div>
</div>

<!-- ÉXITO -->
<div id="screen-success" class="screen">
  <div class="ok-circle">✓</div>
  <div class="ok-num" id="okNum"></div>
  <div class="ok-sub">Pedido registrado correctamente</div>
  <button class="back-btn" onclick="showScreen('screen-registro')">Registrar otro</button>
</div>

<div class="toast" id="toast"></div>
<canvas id="snapCanvas" style="display:none"></canvas>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwru6JSPaxeyNZCyYTiyFq8pXaMRvU3n9SR4ybwVbdF6nfVg6YmS2Q8c0n61M9V2ZC3Dw/exec';
  const COLORS = ['#7c8cff','#22c55e','#f59e0b','#ec4899','#14b8a6','#a855f7','#e11d48','#0ea5e9','#84cc16','#f97316','#8b5cf6','#10b981','#f43f5e','#06b6d4'];
  let selEmp = null, curPin = '', curUser = null, orders = [];
  let videoStream = null, scanInterval = null, scanning = false;

  // JSONP
  function jsonp(url) {
    return new Promise((resolve, reject) => {
      const cb = 'cb_' + Math.random().toString(36).slice(2);
      const s = document.createElement('script');
      const timeout = setTimeout(() => { delete window[cb]; document.head.removeChild(s); reject(new Error('Timeout')); }, 10000);
      window[cb] = data => { clearTimeout(timeout); delete window[cb]; document.head.removeChild(s); resolve(data); };
      s.src = url + '&callback=' + cb;
      s.onerror = () => { clearTimeout(timeout); reject(new Error('Error de red')); };
      document.head.appendChild(s);
    });
  }

  async function loadEmployees() {
    try {
      const data = await jsonp(APPS_SCRIPT_URL + '?action=getEmployees');
      buildGrid(data);
    } catch(e) {
      document.getElementById('empGrid').innerHTML = '<p style="color:red;font-size:13px;grid-column:span 2;text-align:center">Error al cargar. Recargá la página.</p>';
    }
  }

  function buildGrid(employees) {
    const g = document.getElementById('empGrid');
    g.innerHTML = '';
    employees.forEach((emp, i) => {
      const initials = emp.name.split(' ').map(w => w[0]).join('').substring(0,2);
      const color = COLORS[i % COLORS.length];
      const d = document.createElement('div');
      d.className = 'emp-btn'; d.id = 'eb' + i;
      d.innerHTML = '<div class="emp-avatar" style="background:' + color + '22;color:' + color + '">' + initials + '</div><div class="emp-name">' + emp.name + '</div>';
      d.onclick = () => pickEmp(i, emp.name);
      g.appendChild(d);
    });
  }

  function pickEmp(i, name) {
    selEmp = { i, name }; curPin = '';
    document.querySelectorAll('.emp-btn').forEach((b,j) => b.classList.toggle('selected', j===i));
    document.getElementById('pinWho').textContent = 'PIN de ' + name.split(' ')[0];
    document.getElementById('pinBox').style.display = 'block';
    updDots();
  }

  function kp(d) {
    if (curPin.length >= 4) return;
    curPin += d; updDots();
    if (curPin.length === 4) setTimeout(checkPin, 150);
  }
  function delK() { curPin = curPin.slice(0,-1); updDots(); }
  function updDots() {
    for (let i=0;i<4;i++) document.getElementById('pd'+i).classList.toggle('filled', i < curPin.length);
  }

  async function checkPin() {
    try {
      const ok = await jsonp(APPS_SCRIPT_URL + '?action=verifyPin&name=' + encodeURIComponent(selEmp.name) + '&pin=' + curPin);
      if (ok) {
        curUser = selEmp.name;
        document.getElementById('welcomeName').textContent = 'Hola, ' + curUser.split(' ')[0] + ' 👋';
        orders = []; document.getElementById('orderInput').value = '';
        document.getElementById('confirmBtn').disabled = true;
        renderList(); showScreen('screen-registro');
      } else {
        document.getElementById('pinWho').textContent = '❌ PIN incorrecto';
        curPin = ''; updDots();
      }
    } catch(e) { showToast('Error de conexión'); curPin = ''; updDots(); }
  }

  function resetLogin() {
    selEmp = null; curPin = '';
    document.querySelectorAll('.emp-btn').forEach(b => b.classList.remove('selected'));
    document.getElementById('pinBox').style.display = 'none';
    updDots();
  }
  function doLogout() { curUser = null; resetLogin(); showScreen('screen-login'); }

  // ESCÁNER — canvas manual con alta resolución
  async function startScanner() {
    document.getElementById('scanBox').style.display = 'block';
    document.getElementById('scanBtn').disabled = true;
    document.getElementById('scanStatus').textContent = 'Iniciando cámara...';
    scanning = true;

    try {
      videoStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      });

      const video = document.getElementById('video');
      video.srcObject = videoStream;
      await new Promise(r => { video.onloadedmetadata = r; });
      await video.play();

      // Esperar que la cámara enfoque
      await new Promise(r => setTimeout(r, 1200));
      document.getElementById('scanStatus').textContent = 'Apuntá al código de barras';

      const hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
        ZXing.BarcodeFormat.CODE_128,
        ZXing.BarcodeFormat.CODE_39,
        ZXing.BarcodeFormat.EAN_13,
        ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.ITF
      ]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      const reader = new ZXing.MultiFormatReader();
      reader.setHints(hints);

      const canvas = document.getElementById('snapCanvas');
      const ctx = canvas.getContext('2d');

      scanInterval = setInterval(() => {
        if (!scanning || video.readyState < 2) return;
        const vw = video.videoWidth, vh = video.videoHeight;
        if (!vw || !vh) return;

        // Recortar zona central donde está el código
        const cropX = vw * 0.05;
        const cropY = vh * 0.25;
        const cropW = vw * 0.90;
        const cropH = vh * 0.50;

        canvas.width = cropW;
        canvas.height = cropH;
        ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

        try {
          const imgData = ctx.getImageData(0, 0, cropW, cropH);
          const luminance = new ZXing.RGBLuminanceSource(imgData.data, cropW, cropH);
          const bitmap = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(luminance));
          const result = reader.decode(bitmap);
          if (result) {
            const code = result.getText();
            stopScanner();
            document.getElementById('orderInput').value = code;
            onOrderInput();
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            showToast('✓ Leído: ' + code);
          }
        } catch(e) { /* sigue intentando */ }
      }, 150);

    } catch(e) {
      stopScanner();
      showToast('No se pudo acceder a la cámara');
    }
  }

  function stopScanner() {
    scanning = false;
    if (scanInterval) { clearInterval(scanInterval); scanInterval = null; }
    if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); videoStream = null; }
    const video = document.getElementById('video');
    video.srcObject = null;
    document.getElementById('scanBox').style.display = 'none';
    document.getElementById('scanBtn').disabled = false;
  }

  function onOrderInput() {
    document.getElementById('confirmBtn').disabled = document.getElementById('orderInput').value.trim().length < 2;
  }

  async function doConfirm() {
    const num = document.getElementById('orderInput').value.trim();
    document.getElementById('confirmBtn').disabled = true;
    document.getElementById('confirmBtn').textContent = 'Registrando...';
    try {
      const data = await jsonp(APPS_SCRIPT_URL + '?action=registrar&nombre=' + encodeURIComponent(curUser) + '&pedido=' + encodeURIComponent(num));
      if (data.ok) {
        const now = new Date();
        orders.unshift({ num, time: now.toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' }) });
        document.getElementById('okNum').textContent = num;
        document.getElementById('orderInput').value = '';
        document.getElementById('confirmBtn').textContent = '✓  Confirmar pedido';
        renderList(); showScreen('screen-success');
      } else {
        showToast('Error al registrar. Reintentá.');
        document.getElementById('confirmBtn').disabled = false;
        document.getElementById('confirmBtn').textContent = '✓  Confirmar pedido';
      }
    } catch(e) {
      showToast('Sin conexión. Reintentá.');
      document.getElementById('confirmBtn').disabled = false;
      document.getElementById('confirmBtn').textContent = '✓  Confirmar pedido';
    }
  }

  function renderList() {
    document.getElementById('countToday').textContent = orders.length;
    document.getElementById('listToday').innerHTML = orders.length === 0
      ? '<p style="font-size:13px;color:#aaa;text-align:center;padding:16px 0">Sin registros todavía</p>'
      : orders.map(o => '<div class="order-row"><div><div class="order-num">' + o.num + '</div><div class="order-time">' + o.time + '</div></div><span class="check">✓</span></div>').join('');
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  loadEmployees();
</script>
</body>
</html>
